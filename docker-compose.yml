services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: archscale
      POSTGRES_PASSWORD: archscale_secret
      POSTGRES_DB: archscale_nexus
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
