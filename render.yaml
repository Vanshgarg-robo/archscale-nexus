services:
  # ─────────────────────────────────────────────────────────────────
  # Backend API (FastAPI + Docker)
  # ─────────────────────────────────────────────────────────────────
  - type: web
    name: archscale-nexus
    env: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/ping
    envVars:
      - key: PORT
        value: 8000
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 15
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: 7
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: DATABASE_URL
        sync: false
      - key: SYNC_DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: '["http://localhost:3000","https://archscale-nexus.vercel.app"]'

  # ─────────────────────────────────────────────────────────────────
  # Frontend UI (Next.js Node Web Service)
  # ─────────────────────────────────────────────────────────────────
  - type: web
    name: archscale-nexus-frontend
    env: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NEXT_PUBLIC_API_URL
        value: https://archscale-nexus.onrender.com
